name: Build Pixel 6 Pro NetHunter Kernel (Proton Compiler)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Optimize Environment and Storage
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make git zip \
            libelf-dev libxml2-utils lz4 python3 cpio

      - name: Set Up Git Identity
        run: |
          git config --global user.name "NetHunterBuilder"
          git config --global user.email "builder@nethunter.local"

      - name: Download Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang toolchains/clang --depth=1

      - name: Clone Stable Pixel 6 Pro Kernel Source Tree
        run: |
          git clone https://android.googlesource.com/kernel/common pixel-kernel --depth=1 -b android-mainline

      - name: Apply NetHunter Kernel Configurations
        working-directory: pixel-kernel
        run: |
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            echo "CONFIG_CFG80211=y" >> $DEFCONFIG
            echo "CONFIG_MAC80211=y" >> $DEFCONFIG
            echo "CONFIG_USB_G_ANDROID=y" >> $DEFCONFIG
            echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
          fi

      - name: Compile Custom Kernel Binary
        working-directory: pixel-kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out gki_defconfig
          make -j"$(nproc)" O=out

      - name: Package Output Binaries
        if: always()
        run: |
          mkdir -p flash_output
          if [ -f "pixel-kernel/out/arch/arm64/boot/Image.lz4" ]; then
            cp -v pixel-kernel/out/arch/arm64/boot/Image.lz4 flash_output/ || true
          fi

      - name: Upload Flashable NetHunter Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel6Pro-NetHunter-Kernel
          path: flash_output/
