name: Build Pixel 6 Pro NetHunter Kernel (AOSP Production Tag)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      OUT_DIR: out
      # Target release manifest tracking Android 15 for Pixel 6 series (Raviole)
      MANIFEST_BRANCH: refs/tags/android-15.0.0_r0.20
      DEFCONFIG_NAME: raviole_defconfig

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Google AOSP Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make \
            git zip libelf-dev libxml2-utils \
            lz4 python3 cpio repo

      - name: Set Up Git Credentials
        run: |
          git config --global user.name "KernelBuilder"
          git config --global user.email "builder@kernel.local"

      - name: Initialize and Sync Pixel Kernel Source Tree
        run: |
          mkdir pixel-source && cd pixel-source
          # Pulls the official Google Pixel 6 Pro hardware compilation tree
          repo init -u https://android.googlesource.com/kernel/manifest -b ${{ env.MANIFEST_BRANCH }} --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      - name: Inject NetHunter Kernel Flags
        run: |
          cd pixel-source/private/google-modules/soc/gs
          # Appends essential NetHunter packet injection and BadUSB hooks to the configuration mapping
          if [ -d "arch/arm64/configs" ]; then
            echo "CONFIG_CFG80211=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
            echo "CONFIG_MAC80211=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
            echo "CONFIG_USB_G_ANDROID=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
            echo "CONFIG_USB_F_HID=y" >> arch/arm64/configs/${{ env.DEFCONFIG_NAME }}
          fi

      - name: Compile Pixel Kernel (Modern AOSP Kleaf/Bazel Toolchain)
        run: |
          cd pixel-source
          # Uses Google's integrated hermetic building engine required for Android 15
          tools/bazel run //private/google-modules/soc/gs:raviole_dist -- --dist_dir=$GITHUB_WORKSPACE/out_dist

      - name: Collect and Package Artifacts
        if: always()
        run: |
          mkdir -p final_artifacts
          if [ -d "out_dist" ]; then
            cp -v out_dist/Image.lz4 final_artifacts/ || true
            cp -v out_dist/*.dtb final_artifacts/ || true
          fi

      - name: Upload Flashable NetHunter Output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel6Pro-Android15-NetHunterKernel
          path: final_artifacts/
